<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vid-dl</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>YouTube Downloader</h1>
    <p class="sub">Paste a link, pick a format, hit download. Powered by yt-dlp, running locally on your machine.</p>

    <label for="url">Video URL</label>
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." autofocus>

    <div class="row">
      <div class="fmt-btn active" data-mode="video">🎬 Video (MP4)</div>
      <div class="fmt-btn" data-mode="audio">🎵 Audio only (MP3)</div>
    </div>

    <label for="quality">Max quality</label>
    <select id="quality">
      <option value="best">Best available</option>
      <option value="2160">2160p (4K)</option>
      <option value="1440">1440p (2K)</option>
      <option value="1080" selected>1080p (Full HD)</option>
      <option value="720">720p (HD)</option>
      <option value="480">480p (SD)</option>
    </select>

    <div class="checkbox-row" id="subsRow">
      <input type="checkbox" id="subs" checked>
      <label for="subs">Download English subtitles (.srt) if available</label>
    </div>

    <button class="go" id="goBtn">Download</button>

    <div class="warn" id="ffmpegWarn"></div>

    <div class="status-block" id="statusBlock" style="display:none;">
      <div class="progress-outer"><div class="progress-inner" id="progressInner"></div></div>
      <div class="status-line">
        <span class="state" id="stateText">Starting…</span>
        <span id="percentText">0%</span>
      </div>
      <div class="size-text" id="sizeText"></div>
      <details>
        <summary>Show log</summary>
        <pre class="log" id="logBox"></pre>
      </details>
    </div>

    <div class="footer">
      <span id="saveLoc">Saving to …</span>
      <a id="openFolder">Open downloads folder</a>
    </div>
  </div>

<script src="/app.js"></script>
</body>
</html>
