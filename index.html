<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vid-dl</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>vid-dl</h1>
    <p class="sub">Paste a link, pick a format, add it to the queue. Powered by yt-dlp, running locally on your machine.</p>

    <label for="url">Video URL</label>
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." autofocus>

    <div class="row">
      <div class="fmt-btn active" data-mode="video">🎬 Video (MP4)</div>
      <div class="fmt-btn" data-mode="audio">🎵 Audio only (MP3)</div>
    </div>

    <label for="quality">Max quality</label>
    <select id="quality">
      <option value="best">Best available</option>
      <option value="2160">2160p (4K)</option>
      <option value="1440">1440p (2K)</option>
      <option value="1080" selected>1080p (Full HD)</option>
      <option value="720">720p (HD)</option>
      <option value="480">480p (SD)</option>
    </select>

    <div id="subsSection">
      <label for="subMode">Subtitles</label>
      <select id="subMode">
        <option value="none" selected>None</option>
        <option value="sidecar">Download as a separate .srt file</option>
        <option value="soft">Embed as a track you can switch off</option>
        <option value="burn">Burn permanently into the picture</option>
      </select>

      <div class="sub-options" id="subOptions" style="display:none;">
        <div class="sub-field">
          <label for="subLang">Language</label>
          <select id="subLang">
            <option value="en" selected>English</option>
            <option value="ja">日本語 (Japanese)</option>
            <option value="zh-Hans">中文简体 (Simplified Chinese)</option>
            <option value="zh-Hant">中文繁體 (Traditional Chinese)</option>
            <option value="it">Italiano (Italian)</option>
            <option value="es">Español (Spanish)</option>
            <option value="ko">한국어 (Korean)</option>
          </select>
        </div>
        <div class="sub-field" id="sizeField" style="display:none;">
          <label for="subSize">Text size</label>
          <select id="subSize">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
      </div>
      <p class="sub-note" id="subNote"></p>
    </div>

    <button class="go" id="goBtn">Add to queue</button>

    <div class="warn" id="ffmpegWarn"></div>

    <div class="queue-block" id="queueBlock" style="display:none;">
      <div class="queue-head">
        <span class="queue-title">Queue <span class="queue-count" id="queueCount"></span></span>
        <button class="stop-btn" id="stopBtn">Stop after current</button>
      </div>
      <div id="queueList"></div>
    </div>

    <div class="footer">
      <span id="saveLoc">Saving to …</span>
      <a id="openFolder">Open downloads folder</a>
    </div>
  </div>
<script src="/app.js"></script>
</body>
</html>
