<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8eaed;
    --muted: #9aa0ab;
    --accent: #ff4d4d;
    --accent2: #4dabf7;
    --ok: #51cf66;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #0f1115, #14171e 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--text);
    font-size: 14px;
    margin: 6px 0 18px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent2); }
  .row { display: flex; gap: 12px; margin-bottom: 18px; }
  .fmt-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    text-align: center;
    transition: all .15s;
  }
  .fmt-btn.active { border-color: var(--accent2); color: var(--text); background: rgba(77,171,247,0.08); }
  select#quality {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--text);
    font-size: 14px;
    margin: 6px 0 18px;
    appearance: none;
    -webkit-appearance: none;
  }
  select#quality:disabled { color: var(--muted); cursor: not-allowed; opacity: .6; }
  select#quality:focus { outline: none; border-color: var(--accent2); }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    font-size: 14px;
    color: var(--text);
  }
  .checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent2); cursor: pointer; }
  .checkbox-row label { text-transform: none; font-size: 14px; letter-spacing: normal; color: var(--text); cursor: pointer; }
  .checkbox-row.disabled { opacity: .5; }
  .checkbox-row.disabled label { cursor: not-allowed; }
  .size-text { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  button.go {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: filter .15s;
  }
  button.go:hover { filter: brightness(1.08); }
  button.go:disabled { background: #3a3d45; cursor: not-allowed; }
  .status-block { margin-top: 22px; }
  .progress-outer {
    height: 10px;
    border-radius: 6px;
    background: #0d0f14;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width .3s ease;
  }
  .status-line { font-size: 13px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
  .status-line .state { color: var(--text); font-weight: 600; }
  .status-line .state.done { color: var(--ok); }
  .status-line .state.error { color: var(--err); }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre.log {
    background: #0a0c10;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 11px;
    color: #9aa0ab;
    max-height: 160px;
    overflow-y: auto;
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .footer a { color: var(--accent2); text-decoration: none; cursor: pointer; }
  .warn {
    margin-top: 14px;
    font-size: 12px;
    background: rgba(255,212,59,0.08);
    border: 1px solid rgba(255,212,59,0.35);
    color: #ffd43b;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .warn code {
    background: rgba(0,0,0,0.25);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>YouTube Downloader</h1>
    <p class="sub">Paste a link, pick a format, hit download. Powered by yt-dlp, running locally on your machine.</p>

    <label for="url">Video URL</label>
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." autofocus>

    <div class="row">
      <div class="fmt-btn active" data-mode="video">🎬 Video (MP4)</div>
      <div class="fmt-btn" data-mode="audio">🎵 Audio only (MP3)</div>
    </div>

    <label for="quality">Max quality</label>
    <select id="quality">
      <option value="best">Best available</option>
      <option value="2160">2160p (4K)</option>
      <option value="1440">1440p (2K)</option>
      <option value="1080" selected>1080p (Full HD)</option>
      <option value="720">720p (HD)</option>
      <option value="480">480p (SD)</option>
    </select>

    <div class="checkbox-row" id="subsRow">
      <input type="checkbox" id="subs" checked>
      <label for="subs">Download English subtitles (.srt) if available</label>
    </div>

    <button class="go" id="goBtn">Download</button>

    <div class="warn" id="ffmpegWarn"></div>

    <div class="status-block" id="statusBlock" style="display:none;">
      <div class="progress-outer"><div class="progress-inner" id="progressInner"></div></div>
      <div class="status-line">
        <span class="state" id="stateText">Starting…</span>
        <span id="percentText">0%</span>
      </div>
      <div class="size-text" id="sizeText"></div>
      <details>
        <summary>Show log</summary>
        <pre class="log" id="logBox"></pre>
      </details>
    </div>

    <div class="footer">
      <span id="saveLoc">Saving to …</span>
      <a id="openFolder">Open downloads folder</a>
    </div>
  </div>

<script>
let mode = "video";
let pollTimer = null;
const qualitySelect = document.getElementById("quality");
const subsCheckbox = document.getElementById("subs");
const subsRow = document.getElementById("subsRow");

document.querySelectorAll(".fmt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".fmt-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    qualitySelect.disabled = (mode === "audio");
    subsCheckbox.disabled = (mode === "audio");
    subsRow.classList.toggle("disabled", mode === "audio");
  });
});

fetch("/api/info").then(r => r.json()).then(info => {
  document.getElementById("saveLoc").textContent = "Saving to " + info.output_dir;
  if (info.default_quality) {
    qualitySelect.value = info.default_quality;
  }
  if (!info.ffmpeg_available) {
    const w = document.getElementById("ffmpegWarn");
    w.style.display = "block";
    w.innerHTML = "ffmpeg isn't installed — video quality will be limited and MP3 downloads won't work.<br>" +
      "Install it in Terminal with <code>brew install ffmpeg</code> (get Homebrew first at " +
      '<a href="https://brew.sh" target="_blank" style="color:inherit;">brew.sh</a> if needed) — ' +
      "no manual file placement needed, it goes on your PATH automatically.";
  }
}).catch(() => {});

document.getElementById("openFolder").addEventListener("click", () => {
  fetch("/api/open-folder");
});

document.getElementById("goBtn").addEventListener("click", startDownload);
document.getElementById("url").addEventListener("keydown", e => {
  if (e.key === "Enter") startDownload();
});

function startDownload() {
  const url = document.getElementById("url").value.trim();
  if (!url) return;
  const btn = document.getElementById("goBtn");
  btn.disabled = true;
  btn.textContent = "Working…";
  document.getElementById("statusBlock").style.display = "block";
  setState("starting", 0, [], null, null, null);

  fetch("/api/download", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      url, mode,
      quality: qualitySelect.value,
      subs: mode === "video" ? subsCheckbox.checked : false
    })
  }).then(r => r.json()).then(data => {
    if (data.error) {
      setState("error", 0, [data.error], data.error);
      resetBtn();
      return;
    }
    poll(data.id);
  }).catch(err => {
    setState("error", 0, [String(err)],
      "Couldn't reach the downloader server. Try quitting and relaunching " +
      "'Start YouTube Downloader.command', then reload this page.");
    resetBtn();
  });
}

let pollFailCount = 0;
let stalledSince = null;

function poll(id) {
  clearInterval(pollTimer);
  pollFailCount = 0;
  stalledSince = Date.now();
  pollTimer = setInterval(() => {
    fetch("/api/status?id=" + id).then(r => r.json()).then(job => {
      pollFailCount = 0;
      if (job.status !== "starting") stalledSince = Date.now();
      let log = job.log || [];
      if (job.status === "starting" && Date.now() - stalledSince > 15000) {
        log = log.concat(["(Still starting after 15s — the URL may be invalid, " +
          "or the server may need a restart. Feel free to try again or relaunch " +
          "'Start YouTube Downloader.command'.)"]);
      }
      setState(job.status, job.percent || 0, log, job.error, job.filename, job.size);
      if (job.status === "done" || job.status === "error") {
        clearInterval(pollTimer);
        resetBtn();
      }
    }).catch(() => {
      pollFailCount += 1;
      if (pollFailCount >= 3) {
        clearInterval(pollTimer);
        setState("error", 0, ["Lost connection to the downloader server."],
          "Lost connection to the server. Try relaunching 'Start YouTube Downloader.command'.");
        resetBtn();
      }
    });
  }, 800);
}

function setState(status, percent, log, error, filename, size) {
  document.getElementById("progressInner").style.width = percent + "%";
  document.getElementById("percentText").textContent = Math.round(percent) + "%";
  const stateEl = document.getElementById("stateText");
  stateEl.classList.remove("done", "error");
  if (status === "done") {
    stateEl.textContent = "Done" + (filename ? ": " + filename : "");
    stateEl.classList.add("done");
  } else if (status === "error") {
    stateEl.textContent = "Error: " + (error || "something went wrong");
    stateEl.classList.add("error");
  } else if (status === "running") {
    stateEl.textContent = "Downloading…";
  } else {
    stateEl.textContent = "Starting…";
  }
  document.getElementById("logBox").textContent = (log || []).join("\n");
  const sizeEl = document.getElementById("sizeText");
  sizeEl.textContent = size ? "Total size: " + size : "";
}

function resetBtn() {
  const btn = document.getElementById("goBtn");
  btn.disabled = false;
  btn.textContent = "Download";
}
</script>
</body>
</html>
